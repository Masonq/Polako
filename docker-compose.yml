services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polako
      POSTGRES_USER: polako
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - polako_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polako -d polako"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://polako:${POSTGRES_PASSWORD}@db:5432/polako
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
    ports:
      - "${PORT}:8000"
volumes:
  polako_db:
